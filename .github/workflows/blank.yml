name: Update contributor credits

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-credits:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate credits.md
        run: |
          {
            echo "# Contributors"
            echo
            echo "This file is automatically generated from the Git history."
            echo
            echo '```text'
            git shortlog -sne --all
            echo '```'
          } > credits.md

      - name: Commit updated credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- credits.md; then
            echo "credits.md is already up to date."
            exit 0
          fi

          git add credits.md
          git commit -m "chore: update contributor credits"
          git push
