name: Update contributor credits

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-credits:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate credits.md
        run: |
          {
            echo "# Contributors"
            echo
            echo "This file is automatically generated from the Git history."
            echo
            echo "| Commits | Contributor |"
            echo "| ---: | --- |"

            git shortlog -sne --all | while read -r count name; do
              # Split "Name <email>" into name and email
              contributor=$(echo "$name" | sed 's/ <.*>//')
              echo "| $count | $contributor |"
            done
          } > credits.md

          echo "Generated credits.md:"
          cat credits.md

      - name: Commit credits.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add credits.md

          if git diff --cached --quiet; then
            echo "credits.md is already up to date."
            exit 0
          fi

          git commit -m "chore: update contributor credits"
          git push
